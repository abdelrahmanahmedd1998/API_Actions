[project]
name = "saucedemo"
version = "1.0.0"
description = "PyTest + Playwright (http://api.mathjs.org/v4/)"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0",
    "requests>=2.31",
    "Playwright>=1.51",
]
 
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--browser chromium --html=reports/report.html --self-contained-html --tracing=retain-on-failure --screenshot=only-on-failure"
testpaths = ["tests"]