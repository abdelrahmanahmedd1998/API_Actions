name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v6.3.0
        with:
             python-version: "3.14.6"
             cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt

      - name: Run API test
        env:
          API_BASE_URL: ${{vars.API_BASE_URL}}
        run: python -m pytest tests/test_api.py -v --tb=short
        
      - name: Upload Allure results
        run: |
          python -m pytest -o addopts="" tests/test_api.py -v --tb=short \
            --junitxml=reports/junit-api.xml \
            --alluredir=allure-results
            
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore
        

  ui-smoke:
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          BASE_URL: ${{vars.BASE_URL}}
          SAUCE_VALID_USERNAME: ${{secrets.SAUCE_VALID_USERNAME}}
          SAUCE_PASSWORD: ${{secrets.SAUCE_PASSWORD}}
          SAUCE_LOCKED_USERNAME: ${{secrets.SAUCE_LOCKED_USERNAME}}
        run: |
          python -m pytest tests/test_1.py tests/test_2.py tests/test_3.py -m smoke --browser chromium -v --tb=short \
          --junitxml=re[prts/junit-ui-smoke.xml 
          
      - name: job summary
        if: always()
        run: python scripts/summary.py reports/junit-ui-smoke.xml "UI tests" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            test-results/
            reports/
          retention-days: 7
          if-no-files-found: warn

  ui-regression:
    needs: ui-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: pip  
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt
        
      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{matrix.browser}}    
      
      - name: Run UI regression
        env:
          BASE_URL: ${{vars.BASE_URL}}
          SAUCE_VALID_USERNAME: ${{ secrets.SAUCE_VALID_USERNAME }}
          SAUCE_LOCKED_USERNAME: ${{ secrets.SAUCE_LOCKED_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        
        run: |
          python -m pytest tests/test_1.py tests/test_2.py tests/test_3.py -n 2 auto --browser ${{ matrix.browser }} -v --tb=short \
          --junitxml=reports/junit-ui-${{ matrix.browser }}.xml \
          --alluredir=allure-results

      - name: Job summary
        if: always()
        run: python scripts/summary.py reports/junit-ui-${{ matrix.browser }}.xml "UI regression (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
      
      - name: UPLOAD TEST EVIDENCE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.browser }}
          path: |
            test-results/
            reports/
          retention-days: 7
          if-no-files-found: warn
        
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore    

